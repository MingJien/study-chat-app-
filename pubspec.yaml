name: study_chat_app
description: Ung dung nhan tin va phong thao luan hoc tap cua nhom 3 thanh vien.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_database: ^13.1.0
  http: ^1.6.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/barlow/Barlow-Regular.ttf
        - asset: assets/fonts/barlow/Barlow-SemiBold.ttf
          weight: 600
