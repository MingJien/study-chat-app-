name: TV2 web
on:
  push:
    branches: [tv2]
    paths-ignore: ['docs/**', 'preview/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: npx --yes firebase-tools@15.37.0 emulators:exec --only auth,database --project demo-classroom-tv2 "node --test test/emulator/chat.test.mjs"
      - run: dart run sqflite_common_ffi_web:setup
      - run: python tools/prepare_web.py
      - run: flutter build web --release --no-pub --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: study-chat-tv2-web
          path: build/web/
          retention-days: 30
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub --target-platform android-arm64 --dart-define=EMULATOR_HOST=127.0.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: tv2-android-arm64-demo
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
